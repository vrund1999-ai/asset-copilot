[project]
name = "asset-copilot"
version = "0.1.0"
description = "Evaluated AI agent for commercial real estate portfolio analysis"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "sqlglot>=25.0",
    "anthropic>=0.40",
    "streamlit>=1.67",
    "httpx>=0.27",
    "pandas>=2.2",
    "faker>=26.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
# Local embedding model for document ingestion/retrieval (large install; not needed for tests).
embeddings = ["sentence-transformers>=3.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs Postgres with the synthetic portfolio (skipped when unavailable)"]
pythonpath = ["src", "evals"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "evals"]
